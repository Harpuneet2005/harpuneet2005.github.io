<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Harpuneet Singh — CV</title>
  <meta name="description" content="Harpuneet Singh — CV, links, and contact." />
  <style>
    :root {
      --bg: #0b0f17;
      --card: rgba(255, 255, 255, 0.06);
      --text: #e8ecf1;
      --muted: rgba(232, 236, 241, 0.75);
      --border: rgba(255, 255, 255, 0.14);
      --shadow: 0 18px 60px rgba(0,0,0,0.35);
      --radius: 18px;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, "Apple Color Emoji", "Segoe UI Emoji";
      color: var(--text);
      background:
        radial-gradient(900px 600px at 20% 10%, rgba(74, 114, 255, 0.20), transparent 60%),
        radial-gradient(900px 600px at 90% 30%, rgba(255, 92, 150, 0.16), transparent 55%),
        radial-gradient(1100px 700px at 50% 90%, rgba(64, 255, 189, 0.10), transparent 60%),
        var(--bg);
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 32px 16px;
    }

    .container {
      width: 100%;
      max-width: 960px;
      display: grid;
      gap: 16px;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      overflow: hidden;
    }

    header.card {
      padding: 22px 22px 18px;
      display: grid;
      gap: 10px;
    }

    h1 {
      margin: 0;
      font-size: clamp(26px, 3vw, 34px);
      letter-spacing: 0.2px;
      line-height: 1.15;
    }

    .subtitle {
      margin: 0;
      color: var(--muted);
      line-height: 1.45;
      font-size: 15px;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 6px;
    }

    a.btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 12px;
      border-radius: 999px;
      border: 1px solid var(--border);
      text-decoration: none;
      color: var(--text);
      background: rgba(255,255,255,0.04);
      transition: transform 120ms ease, background 120ms ease, border-color 120ms ease;
      font-size: 14px;
      line-height: 1;
      white-space: nowrap;
    }
    a.btn:hover { transform: translateY(-1px); background: rgba(255,255,255,0.08); border-color: rgba(255,255,255,0.22); }
    a.btn:active { transform: translateY(0px); }

    .btn.primary {
      background: rgba(74, 114, 255, 0.20);
      border-color: rgba(74, 114, 255, 0.45);
    }

    .row {
      display: grid;
      gap: 16px;
      grid-template-columns: 1fr;
    }

    @media (min-width: 980px) {
      .row { grid-template-columns: 1.2fr 0.8fr; }
    }

    .pane {
      padding: 16px;
    }

    .note {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.5;
      margin: 0;
    }

    iframe {
      width: 100%;
      height: min(74vh, 820px);
      border: 1px solid var(--border);
      border-radius: 14px;
      background: rgba(0,0,0,0.15);
    }

    footer {
      text-align: center;
      color: var(--muted);
      font-size: 12px;
      padding: 4px 8px;
    }

    /* Simple inline icons */
    .icon {
      width: 16px;
      height: 16px;
      display: inline-block;
    }
    .icon svg { width: 16px; height: 16px; fill: currentColor; }
  </style>
</head>

<body>
  <main class="container">
    <header class="card">
      <h1>Harpuneet Singh</h1>
      <p class="subtitle">
        HBSc Computer Science (Co-op), University of Toronto<br />
        Research: microfluidics • computational imaging • ML systems
      </p>

      </nav>
    </header>

    <section class="row">
      <div class="card pane">
        <iframe src="./CV.pdf" title="Harpuneet Singh CV PDF"></iframe>

          If the preview doesn’t load, use <a class="btn" style="padding:6px 10px; border-radius:10px;" href="./cv.pdf" target="_blank" rel="noopener">Open CV (PDF)</a>.
        </p>
      </div>

      <aside class="card pane">
        <p class="note">
          <br /><br />

          <br /><br />
        </p>
      </aside>
    </section>

    <footer>
      © <span id="year"></span> Harpuneet Singh
    </footer>
  </main>

  <script>
    document.getElementById("year").textContent = new Date().getFullYear();
  </script>
</body>
</html>
